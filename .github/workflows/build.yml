name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build plugins
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson --stacktrace --no-daemon

      - name: Prepare builds branch
        run: |
          cd "$GITHUB_WORKSPACE"
          if git clone --depth 1 --branch builds \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds 2>/dev/null; then
            echo "Using existing builds branch"
          else
            echo "Creating builds branch"
            rm -rf builds
            mkdir builds
            cd builds
            git init
            git checkout -b builds
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Publish artifacts
        run: |
          rm -f "$GITHUB_WORKSPACE/builds"/plugins.json
          for file in $(find "$GITHUB_WORKSPACE/src" -name '*.cs3'); do
            base="$(basename "$file" .cs3)"
            cp "$file" "$GITHUB_WORKSPACE/builds/${base}-${GITHUB_SHA:0:12}.cs3"
          done
          find "$GITHUB_WORKSPACE/src" -name 'plugins.json' -exec cp {} "$GITHUB_WORKSPACE/builds/" \;
          python3 - <<'PY'
          import json, os
          from urllib.parse import urlsplit, urlunsplit

          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "builds", "plugins.json")
          with open(path) as f:
              plugins = json.load(f)
          tag = os.environ.get("GITHUB_SHA", "dev")[:12]
          for plugin in plugins:
              internal = plugin["internalName"]
              artifact = f"{internal}-{tag}.cs3"
              url = plugin.get("url", "")

              # GitHub's raw host is optionally rewritten to jsDelivr by CloudStream,
              # and jsDelivr can serve a cached old branch file. Use github.com/raw
              # so the downloaded bytes always match fileHash.
              prefix = "https://raw.githubusercontent.com/"
              if url.startswith(prefix):
                  rest = url[len(prefix):]
                  parts = rest.split("/", 3)
                  if len(parts) == 4:
                      url = f"https://github.com/{parts[0]}/{parts[1]}/raw/{parts[2]}/{parts[3]}"

              # A stable CrunchyMe.cs3 is overwritten by every build. A client with a
              # cached older plugins.json would then download the new bytes and fail
              # the digest check. Publish an immutable per-commit file and keep old
              # artifacts in the builds branch so cached manifests stay valid.
              parts = urlsplit(url)
              directory = parts.path.rsplit("/", 1)[0]
              plugin["url"] = urlunsplit((parts.scheme, parts.netloc, f"{directory}/{artifact}", "", ""))
          with open(path, "w") as f:
              json.dump(plugins, f, indent=4)

          # Fail the build if the immutable file is missing or its hash is wrong.
          import hashlib
          for plugin in plugins:
              if plugin["url"].startswith("https://raw.githubusercontent.com/"):
                  raise SystemExit("plugin URL must not use raw.githubusercontent.com")
              artifact = plugin["url"].rsplit("/", 1)[-1]
              file = os.path.join(os.environ["GITHUB_WORKSPACE"], "builds", artifact)
              digest = "sha256-" + hashlib.sha256(open(file, "rb").read()).hexdigest()
              if plugin.get("fileHash") != digest:
                  raise SystemExit(f"fileHash mismatch for {plugin['internalName']}")
              if plugin.get("fileSize") not in (None, os.path.getsize(file)):
                  raise SystemExit(f"fileSize mismatch for {plugin['internalName']}")
          PY
          python3 - <<'PY'
          import json, os
          slug = os.environ["GITHUB_REPOSITORY"]
          repo = {
              "name": "CrunchyMe + MegaFlix",
              "description": "CrunchyMe plus MegaFlix, a runtime aggregator over installed CloudStream providers",
              "manifestVersion": 1,
              "pluginLists": [f"https://github.com/{slug}/raw/builds/plugins.json"],
          }
          with open(os.path.join(os.environ["GITHUB_WORKSPACE"], "builds", "repo.json"), "w") as f:
              json.dump(repo, f, indent=2)
          PY

      - name: Push builds
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Build $GITHUB_SHA"
            git push origin builds --force
          else
            echo "No changes to push"
          fi
